<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#02030a;overflow:hidden;
    font-family:"Courier New",monospace;color:#e8eeff;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}

  /* ---------- the room ---------- */
  #room{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(120% 80% at 50% 0%,rgba(60,90,220,.20) 0%,rgba(0,0,0,0) 60%),
      radial-gradient(90% 60% at 50% 100%,rgba(255,210,59,.07) 0%,rgba(0,0,0,0) 60%),
      #02030a;
    padding:6px 6px 22px;}
  #floor{position:absolute;left:0;right:0;bottom:0;height:32%;pointer-events:none;
    background:
      repeating-linear-gradient(90deg,rgba(95,120,200,.16) 0 1px,rgba(0,0,0,0) 1px 46px),
      repeating-linear-gradient(0deg,rgba(95,120,200,.13) 0 1px,rgba(0,0,0,0) 1px 30px),
      linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(20,26,51,.5) 100%);
    transform:perspective(340px) rotateX(62deg);transform-origin:50% 100%;
    -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,0) 0%,#000 45%);
    mask-image:linear-gradient(180deg,rgba(0,0,0,0) 0%,#000 45%);}

  /* ---------- cabinet ---------- */
  #cab{position:relative;display:flex;flex-direction:column;align-items:center;
    --sw:min(64vw, 47vh);   /* screen width; screen is 3:4 */
    width:calc(var(--sw) * 1.30);
    filter:drop-shadow(0 24px 40px rgba(0,0,0,.75));}

  #marquee{position:relative;width:100%;height:calc(var(--sw) * .215);
    border-radius:14px 14px 4px 4px;overflow:hidden;
    background:linear-gradient(180deg,#1b2450 0%,#0d1330 100%);
    border:2px solid #3a4a99;border-bottom:none;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 34px rgba(255,210,59,.20),inset 0 0 40px rgba(255,210,59,.10);}
  #marquee::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.20) 0 1px,rgba(0,0,0,0) 1px 3px);}
  #mqtext{text-align:center;line-height:1.05;padding:0 8px;}
  #mqmain{font-weight:bold;letter-spacing:.13em;
    font-size:calc(var(--sw) * .082);
    color:#ffd23b;text-shadow:0 0 10px rgba(255,210,59,.85),0 0 26px rgba(255,140,0,.45);}
  #mqsub{font-size:calc(var(--sw) * .030);letter-spacing:.30em;color:#7fa0ff;margin-top:.35em;}
  .flick{animation:flick 6.5s infinite;}
  @keyframes flick{0%,96%,100%{opacity:1}97%{opacity:.55}98%{opacity:1}99%{opacity:.7}}

  #hood{width:100%;height:calc(var(--sw) * .035);
    background:linear-gradient(180deg,#0a0f26,#141a33);
    border-left:2px solid #3a4a99;border-right:2px solid #3a4a99;}

  #bezel{position:relative;width:100%;padding:calc(var(--sw) * .055);
    background:linear-gradient(180deg,#141a33 0%,#0a0f26 100%);
    border:2px solid #3a4a99;border-top:none;border-bottom:none;
    display:flex;justify-content:center;overflow:hidden;}
  /* cabinet side art */
  #bezel::before,#bezel::after{content:"";position:absolute;top:0;bottom:0;
    width:calc(var(--sw) * .038);opacity:.20;
    background:linear-gradient(180deg,#ff5d73 0%,#ffd23b 32%,#8ef0a0 58%,#7fa0ff 84%,#9f6bff 100%);}
  #bezel::before{left:0;} #bezel::after{right:0;}
  #screenbox{position:relative;width:var(--sw);aspect-ratio:3/4;
    background:#02030a;border-radius:10px;overflow:hidden;
    box-shadow:inset 0 0 0 3px #05070f, inset 0 0 40px rgba(0,0,0,.9),
               0 0 44px rgba(60,120,255,.28);}
  #c{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block;}
  #crt{position:absolute;inset:0;pointer-events:none;z-index:6;
    background:
      repeating-linear-gradient(0deg,rgba(0,0,0,.26) 0,rgba(0,0,0,.26) 1px,
                                     rgba(0,0,0,0) 2px,rgba(0,0,0,0) 3px),
      radial-gradient(120% 120% at 50% 50%,rgba(0,0,0,0) 52%,rgba(0,0,0,.60) 100%);
    mix-blend-mode:multiply;}
  #offline{position:absolute;inset:0;z-index:8;display:none;
    flex-direction:column;align-items:center;justify-content:center;
    gap:calc(var(--sw) * .035);text-align:center;padding:8%;
    background:rgba(2,3,10,.94);}
  #offline.on{display:flex;}
  #offh{color:#ff5d73;font-weight:bold;letter-spacing:.12em;
    font-size:calc(var(--sw) * .055);text-shadow:0 0 14px rgba(255,93,115,.5);}
  #offb{color:#9fb6ff;font-size:calc(var(--sw) * .030);line-height:1.6;max-width:92%;}
  #glare{position:absolute;inset:0;pointer-events:none;z-index:7;
    background:linear-gradient(150deg,rgba(200,225,255,.10) 0%,rgba(255,255,255,0) 42%);}

  /* ---------- control panel ---------- */
  #panel{position:relative;width:100%;
    background:linear-gradient(180deg,#1b2450 0%,#10162f 60%,#0a0f26 100%);
    border:2px solid #3a4a99;border-top:none;border-radius:0 0 16px 16px;
    padding:calc(var(--sw) * .035) calc(var(--sw) * .045);
    display:flex;align-items:center;gap:calc(var(--sw) * .035);}
  #panel::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;
    background:linear-gradient(90deg,#ff5d73,#ffd23b,#8ef0a0,#7fa0ff,#ff5d73);opacity:.75;}

  #stick{flex:0 0 auto;width:calc(var(--sw) * .115);height:calc(var(--sw) * .115);
    position:relative;display:flex;align-items:flex-end;justify-content:center;}
  #stickbase{position:absolute;bottom:0;width:100%;height:44%;border-radius:50%;
    background:radial-gradient(circle at 50% 30%,#2b3670,#0a0f26);border:1px solid #4a5da8;}
  #stickshaft{position:absolute;bottom:14%;width:12%;height:60%;background:#5f7ad0;border-radius:3px;
    transform-origin:50% 100%;transition:transform .09s ease-out;}
  #stickball{position:absolute;bottom:62%;width:38%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 34% 30%,#ff9aa8,#c0392b);
    box-shadow:0 0 12px rgba(255,93,115,.55);transform-origin:50% 300%;transition:transform .09s ease-out;}
  .tiltL #stickshaft,.tiltL #stickball{transform:rotate(-20deg);}
  .tiltR #stickshaft,.tiltR #stickball{transform:rotate(20deg);}

  #btns{flex:1 1 auto;display:flex;flex-wrap:wrap;align-items:center;
    gap:calc(var(--sw) * .022);justify-content:center;}
  .ab{cursor:pointer;font-family:inherit;font-weight:bold;letter-spacing:.10em;
    font-size:calc(var(--sw) * .032);padding:.55em .85em;border-radius:999px;
    background:linear-gradient(180deg,#26305e,#141a33);color:#bcd0ff;
    border:1px solid #4a5da8;box-shadow:0 3px 0 #070b1a;
    transition:transform .06s,box-shadow .06s,background .12s,color .12s;white-space:nowrap;}
  .ab:hover{background:linear-gradient(180deg,#33407a,#1a2244);color:#e8eeff;}
  .ab:active{transform:translateY(3px);box-shadow:0 0 0 #070b1a;}
  .ab.start{background:linear-gradient(180deg,#ffd23b,#c99500);color:#2a1c00;border-color:#ffe98a;
    box-shadow:0 3px 0 #4a3700,0 0 18px rgba(255,210,59,.45);}
  .ab.start:hover{background:linear-gradient(180deg,#ffe36f,#dda600);color:#2a1c00;}
  .ab.round{width:calc(var(--sw) * .085);height:calc(var(--sw) * .085);padding:0;
    display:flex;align-items:center;justify-content:center;font-size:calc(var(--sw) * .038);line-height:1;}

  #side{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;
    gap:calc(var(--sw) * .014);}
  #langs{display:flex;gap:3px;}
  .lg{cursor:pointer;font-family:inherit;font-size:calc(var(--sw) * .026);font-weight:bold;
    padding:.32em .45em;border-radius:5px;background:#0a0f26;color:#5f7ad0;
    border:1px solid #2b3670;letter-spacing:.05em;}
  .lg:hover{color:#bcd0ff;border-color:#4a5da8;}
  .lg.on{background:#ffd23b;color:#2a1c00;border-color:#ffe98a;
    box-shadow:0 0 10px rgba(255,210,59,.5);}
  #coin{font-size:calc(var(--sw) * .024);color:#5f7ad0;letter-spacing:.14em;white-space:nowrap;}

  /* ---------- footer ---------- */
  #foot{position:fixed;left:0;right:0;bottom:2px;text-align:center;
    font-size:11px;color:#3a4a99;letter-spacing:.10em;pointer-events:none;z-index:2;}
  #foot a{color:#5f7ad0;text-decoration:none;pointer-events:auto;}
  #foot a:hover{color:#ffd23b;}

  /* ---------- narrow screens: strip the cabinet down ---------- */
  @media (max-width:640px){
    #cab{--sw:min(89vw, 45vh);width:calc(var(--sw) * 1.10);}
    #stick{display:none;}
    #panel{flex-direction:column;gap:calc(var(--sw) * .028);}
    #side{align-items:center;}
    #foot{display:none;}
  }
  @media (max-height:600px) and (min-width:641px){
    #cab{--sw:min(44vw, 50vh);}
    #marquee{height:calc(var(--sw) * .16);}
    #floor{display:none;}
    #foot{display:none;}
  }
  @media (max-height:600px) and (max-width:640px){
    #cab{--sw:min(52vw, 66vh);width:calc(var(--sw) * 1.10);}
    #marquee{height:calc(var(--sw) * .16);}
    #floor{display:none;}
  }

  /* ---- touch targets -------------------------------------------------
     The panel is sized from --sw, which on a phone leaves the language
     chips around 22x19px — far under the ~44px a fingertip needs. On a
     coarse pointer give every control a real minimum size, and take the
     extra panel height back out of the screen so the cabinet still fits. */
  @media (pointer:coarse){
    #room{padding:6px;}
    #cab{--sw:min(60vw, 38vh);}
    #langs{gap:6px;}
    .lg{min-width:46px;min-height:46px;padding:0;font-size:15px;
        display:inline-flex;align-items:center;justify-content:center;}
    .ab{min-height:48px;padding:0 18px;font-size:15px;}
    .ab.round{width:54px;height:54px;font-size:24px;}
    #btns{gap:10px;}
    #coin{font-size:12px;}
  }
  @media (pointer:coarse) and (max-width:640px){
    #cab{--sw:min(89vw, 39vh);width:calc(var(--sw) * 1.10);}
  }
  /* Phone held sideways: too short for a 3:4 cabinet plus finger-sized
     controls stacked under it, so widen the body and let the panel spread
     out along the extra width instead of growing downwards. */
  @media (pointer:coarse) and (max-height:600px){
    #cab{--sw:min(40vw, 35vh);width:min(94vw, calc(var(--sw) * 1.30 + 300px));}
    #marquee{height:calc(var(--sw) * .20);}
    #stick{display:none;}
    .ab{min-height:44px;padding:0 12px;font-size:13px;}
    .lg{min-width:40px;min-height:40px;font-size:13px;}
    .ab.round{width:44px;height:44px;font-size:19px;}
    #coin{font-size:11px;}
  }
</style>
</head>

function safeLS(k,v){
  try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; }
}
function detectLang(){
  const saved=safeLS('arcade_lang');
  if(saved&&LANGS.includes(saved)) return saved;
  try{
    const list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||'en'];
    for(const raw of list){ const l=String(raw).slice(0,2).toLowerCase(); if(LANGS.includes(l)) return l; }
  }catch(e){}
  return 'en';
}
let lang=detectLang();
function T(k){ return (STR[lang]&&STR[lang][k]) || STR.en[k] || k; }
function G(g,k){ return (g[k]&&(g[k][lang]||g[k].en)) || ''; }

/* ---------------- audio ---------------- */
let AC=null, muted=(safeLS('arcade_mute')==='1');
function ac(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC&&AC.state==='suspended'){ try{ AC.resume(); }catch(e){} }
  return AC;
}
function beep(freq,dur,type,vol){
  if(muted) return;
  const a=ac(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'square'; o.frequency.value=freq;
  const t=a.currentTime;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.045,t+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.07));
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+(dur||0.07)+0.02);
}

  back: ()=>{beep(400,0.06,'square',0.04); setTimeout(()=>beep(260,0.09,'square',0.04),60);}

function gameURL(g){
  // On github.io a sibling path keeps forks working; elsewhere fall back to the canonical host.
  try{ if(location.hostname.endsWith('github.io')) return '../'+g.repo+'/'; }catch(e){}
  return 'https://ulebule.github.io/'+g.repo+'/';
}

function mkBtn(label,cls,fn,title){

/* ---------------- navigation ---------------- */
function move(d){
  sel=(sel+d+GAMES.length)%GAMES.length;
  sfx.move(); tilt(d); coinT=0; buildChrome();
}
function selectOnly(i){ if(i===sel) return; sel=i; sfx.move(); buildChrome(); }
function launch(i){
  sel=((i%GAMES.length)+GAMES.length)%GAMES.length;
  buildChrome();
  openGame(GAMES[sel]);
}
/* Games run in their own window rather than in a frame: full screen estate,
   their own history and fullscreen button, and no keyboard focus tug-of-war.
   The window is named, so launching a second game reuses it instead of
   leaving a trail of tabs. No 'noopener' here — that would return null and
   cost us the focus() call, and everything we open is our own page. */
function openGame(g){
  const url=gameURL(g);
  sfx.coin();
  let w=null;
  try{ w=window.open(url,GAME_WINDOW); }catch(e){}
  if(w){
    try{ w.focus(); }catch(e){}
    showNotice(false);
    pendingURL=null;
    return true;
  }
  pendingURL=url;          // a pop-up blocker ate it; offer a direct click
  showNotice(true);
  return false;
}

/* ---------------- keyboard ---------------- */
addEventListener('keydown',e=>{
  if(noticeOpen()){ if(e.key==='Escape'){ e.preventDefault(); showNotice(false); } return; }
  ac();
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Enter'].includes(e.key)) e.preventDefault();
  if(e.repeat) return;
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') move(-1);
  else if(e.key==='ArrowRight'||e.key==='ArrowDown') move(1);
  else if(e.key==='Enter'||e.key===' ') launch(sel);
  else if(e.key==='m'||e.key==='M') toggleMute();
  else if(e.key==='l'||e.key==='L') setLang(LANGS[(LANGS.indexOf(lang)+1)%LANGS.length]);
  else if(e.key>='1'&&e.key<='9'){ const i=+e.key-1; if(i<GAMES.length) launch(i); }
});

/* ---------------- pointer on the menu screen ---------------- */
const rows=[];  // filled by the renderer: {y0,y1,i}
function canvasPoint(ev){
  const r=cv.getBoundingClientRect();
  const cx=(ev.clientX!==undefined?ev.clientX:(ev.touches&&ev.touches[0].clientX));
  const cy=(ev.clientY!==undefined?ev.clientY:(ev.touches&&ev.touches[0].clientY));
  return {x:(cx-r.left)/r.width*W, y:(cy-r.top)/r.height*H};
}
let hover=-1;
cv.addEventListener('mousemove',ev=>{
  const p=canvasPoint(ev); hover=-1;
  for(const r of rows) if(p.y>=r.y0&&p.y<=r.y1) hover=r.i;
  cv.style.cursor=(hover>=0||p.y<CARD_Y1)?'pointer':'default';
});
cv.addEventListener('mouseleave',()=>{hover=-1;});
cv.addEventListener('click',ev=>{
  if(noticeOpen()) return;
  ac();
  const p=canvasPoint(ev);
  for(const r of rows){
    if(p.y>=r.y0&&p.y<=r.y1){ if(r.i===sel) launch(r.i); else selectOnly(r.i); return; }
  }
  if(p.y<CARD_Y1) launch(sel);            // tapping the preview starts it
});
cv.addEventListener('touchstart',ev=>{
  if(noticeOpen()) return;
  ev.preventDefault(); ac();
  const p=canvasPoint(ev);
  for(const r of rows){
    if(p.y>=r.y0&&p.y<=r.y1){ if(r.i===sel) launch(r.i); else selectOnly(r.i); return; }
  }
  if(p.y<CARD_Y1) launch(sel);
},{passive:false});

/* ---- preview art (procedural, one per game) ---- */
function artTower(x0,y0,x1,y1,t){
  const w=x1-x0,h=y1-y0, cx=x0+w/2;
  X.save(); X.beginPath(); X.rect(x0,y0,w,h); X.clip();
  const g=X.createLinearGradient(0,y0,0,y1);
  g.addColorStop(0,'#0a1038'); g.addColorStop(0.6,'#060b22'); g.addColorStop(1,'#04060f');
  X.fillStyle=g; X.fillRect(x0,y0,w,h);
  // sky
  for(let i=0;i<28;i++){
    const sx=x0+((i*137)%(w-4))+2, sy=y0+((i*89)%(h-4))+2;
    X.fillStyle=(i%3)?'rgba(150,180,255,.30)':'rgba(230,240,255,.55)';
    X.fillRect(sx|0,sy|0,1.6,1.6);
  }
  const R=w*0.115, top=y0+6, bot=y1-4;
  const rot=t*0.75, RH=13, off=(t*26)%RH, N=22, SEG=14;
  const nrows=Math.ceil((bot-top)/RH)+2;
  const angOf=i=>(-Math.PI/2+((i+0.5)/N)*Math.PI);
  // tower body
  for(let i=0;i<N;i++){
    const sx=cx+Math.sin(-Math.PI/2+(i/N)*Math.PI)*R;
    const ex=cx+Math.sin(-Math.PI/2+((i+1)/N)*Math.PI)*R;
    const a=angOf(i), d=Math.cos(a), s=0.16+0.92*d;
    const surf=((a+rot)%TAU+TAU)%TAU, col=Math.floor(surf/(TAU/SEG));
    for(let r=-1;r<nrows;r++){
      const yy=top+r*RH+off;
      const y=Math.max(yy,top), yb=Math.min(yy+RH-1.5,bot);
      if(yb<=y) continue;
      const base=((col+r)%2)?[104,132,214]:[66,90,168];
      X.fillStyle='rgb('+(base[0]*s|0)+','+(base[1]*s|0)+','+(base[2]*s|0)+')';
      X.fillRect(sx,y,Math.max(1,ex-sx+0.8),yb-y);
    }
  }
  // ledges wrapping the tower
  const LED=[[0.0,0.80],[2.1,0.60],[4.0,0.40],[5.4,0.22]];
  for(const [la,fy] of LED){
    const ly=top+(bot-top)*fy+off*0.35;
    for(let i=0;i<N;i++){
      const a=angOf(i), d=Math.cos(a);
      const surf=((a+rot)%TAU+TAU)%TAU;
      let ad=Math.abs(surf-la); if(ad>Math.PI) ad=TAU-ad;
      if(ad>0.62) continue;
      const sx=cx+Math.sin(-Math.PI/2+(i/N)*Math.PI)*R;
      const ex=cx+Math.sin(-Math.PI/2+((i+1)/N)*Math.PI)*R;
      X.fillStyle='rgba(143,240,160,'+(0.30+0.65*d)+')';
      X.fillRect(sx,ly,Math.max(1,ex-sx+0.8),5);
    }
  }
  // door on the front face, near the top
  const fs=Math.cos(rot);
  if(fs>0.15){
    const dx=cx+Math.sin(-rot)*R*0.0;
    X.fillStyle='rgba(255,93,115,'+(0.45+0.55*fs)+')';
    X.fillRect(dx-7*fs-3,top+16,14*fs+6,20);
    X.fillStyle='rgba(2,3,10,.6)'; X.fillRect(dx-1,top+24,2,4);
  }
  // hero hopping on the front face
  const hop=Math.abs(Math.sin(t*3.2))*11;
  const hy=top+(bot-top)*0.80+off*0.35-hop;
  X.fillStyle='#ffd23b'; X.fillRect(cx-5,hy-15,10,15);
  X.fillStyle='#02030a'; X.fillRect(cx-3,hy-12,2,2); X.fillRect(cx+1,hy-12,2,2);
  X.fillStyle='#ff5d73'; X.fillRect(cx-5,hy-4,10,4);
  X.restore();
}
function artPinball(x0,y0,x1,y1,t){
  const w=x1-x0,h=y1-y0, cx=x0+w/2;
  X.save(); X.beginPath(); X.rect(x0,y0,w,h); X.clip();
  X.fillStyle='#04060f'; X.fillRect(x0,y0,w,h);
  // narrow upright playfield in the middle, like a real table
  const pw=Math.min(w*0.44,h*0.80), px0=cx-pw/2, px1=cx+pw/2, py0=y0+5, py1=y1-5;
  const g=X.createLinearGradient(0,py0,0,py1);
  g.addColorStop(0,'#12294a'); g.addColorStop(1,'#050c1c');
  X.fillStyle=g; X.fillRect(px0,py0,pw,py1-py0);
  X.strokeStyle='rgba(127,160,255,.65)'; X.lineWidth=2.5;
  X.beginPath();
  X.moveTo(px0+1,py1); X.lineTo(px0+1,py0+26);
  X.quadraticCurveTo(cx,py0-6,px1-1,py0+26); X.lineTo(px1-1,py1); X.stroke();
  // plunger lane
  X.fillStyle='rgba(95,120,200,.30)'; X.fillRect(px1-11,py0+34,2,py1-py0-40);
  // bumpers
  const bump=[[cx,py0+h*0.16],[cx-pw*0.22,py0+h*0.30],[cx+pw*0.22,py0+h*0.30]];
  bump.forEach((b,i)=>{
    const pu=0.5+0.5*Math.sin(t*3+i*2), R=9+pu*2.5;
    X.fillStyle=['#6ad0ff','#ffd23b','#8ef0a0'][i];
    X.globalAlpha=0.55+0.45*pu;
    X.beginPath(); X.arc(b[0],b[1],R,0,TAU); X.fill();
    X.globalAlpha=1;
    X.strokeStyle='rgba(255,255,255,.6)'; X.lineWidth=1.6;
    X.beginPath(); X.arc(b[0],b[1],R,0,TAU); X.stroke();
  });
  // drop-target bank
  const tw=(pw-34)/5;
  for(let i=0;i<5;i++){
    X.fillStyle=(Math.floor(t*1.6+i)%3)?'#5f7ad0':'#ff5d73';
    X.fillRect(px0+17+i*tw,py0+h*0.47,tw-5,6);
  }
  // slingshots
  X.fillStyle='rgba(255,93,115,.5)';
  X.beginPath(); X.moveTo(px0+6,py1-58); X.lineTo(px0+22,py1-40); X.lineTo(px0+6,py1-30); X.fill();
  X.beginPath(); X.moveTo(px1-6,py1-58); X.lineTo(px1-22,py1-40); X.lineTo(px1-6,py1-30); X.fill();
  // flippers, meeting over a drain gap
  const fy=py1-14, gap=pw*0.28, len=pw*0.24, ang=Math.max(0,Math.sin(t*2.4))*0.55;
  function flip(px,dir){
    X.save(); X.translate(px,fy); X.rotate(dir*(0.40-ang));
    X.fillStyle='#ff5d73'; X.beginPath();
    X.moveTo(0,-5.5); X.lineTo(dir*len,-3); X.lineTo(dir*len,3); X.lineTo(0,6); X.closePath(); X.fill();
    X.restore();
  }
  flip(cx-gap,1); flip(cx+gap,-1);
  // ball
  const bx=cx+Math.sin(t*1.7)*pw*0.30, by=py0+h*0.26+Math.abs(Math.sin(t*2.2))*h*0.40;
  X.fillStyle='#e8eeff'; X.beginPath(); X.arc(bx,by,6,0,TAU); X.fill();
  X.fillStyle='rgba(255,255,255,.95)'; X.beginPath(); X.arc(bx-2,by-2,2,0,TAU); X.fill();
  X.restore();
}
function artBatty(x0,y0,x1,y1,t){

  const px=cx+Math.sin(t*1.9)*w*0.26;
  X.fillStyle='#6ad0ff'; X.fillRect(px-27,y1-20,54,8);
  X.fillStyle='#e8eeff'; X.fillRect(px-27,y1-20,54,2);
  // ball
  const bx=px+Math.sin(t*3.1)*22, by=y0+h*0.55+Math.abs(Math.sin(t*2.6))*h*0.30;
  X.fillStyle='#ffd23b'; X.fillRect(bx-4,by-4,8,8);
  X.restore();
}
function artBoulder(x0,y0,x1,y1,t){
  const w=x1-x0,h=y1-y0;
  X.save(); X.beginPath(); X.rect(x0,y0,w,h); X.clip();
  X.fillStyle='#0a0704'; X.fillRect(x0,y0,w,h);
  // cave grid — a stable pseudo-random layout that "falls" as time passes
  const COLS=18, S=w/COLS, ROWS=Math.ceil(h/S);
  const drop=(t*S*0.55)%S, shift=Math.floor(t*0.55);
  const cell=(c,r)=>{
    const n=(c*73856093 ^ ((r+shift)*19349663))>>>0;
    const v=n%100;
    if(v<7)  return 'D';      // diamond
    if(v<20) return 'O';      // boulder
    if(v<28) return ' ';      // dug-out space
    if(v<32) return 'W';      // wall
    return '.';               // soil
  };
  for(let r=-1;r<=ROWS;r++) for(let c=0;c<COLS;c++){
    const px=x0+c*S, py=y0+r*S+drop, k=cell(c,r);
    if(k==='.'){
      X.fillStyle='#6b4a1e'; X.fillRect(px,py,S,S);
      X.fillStyle='rgba(255,220,150,.16)';
      X.fillRect(px+S*0.18,py+S*0.22,1.6,1.6); X.fillRect(px+S*0.62,py+S*0.58,1.6,1.6);
    }else if(k==='W'){
      X.fillStyle='#8a8f9e'; X.fillRect(px,py,S,S);
      X.fillStyle='rgba(0,0,0,.30)'; X.fillRect(px,py+S-2,S,2); X.fillRect(px+S-2,py,2,S);
    }else if(k==='O'){
      X.fillStyle='#b9bcc6'; X.beginPath(); X.arc(px+S/2,py+S/2,S*0.44,0,TAU); X.fill();
      X.fillStyle='rgba(255,255,255,.45)'; X.beginPath(); X.arc(px+S*0.36,py+S*0.34,S*0.13,0,TAU); X.fill();
      X.fillStyle='rgba(0,0,0,.28)'; X.beginPath(); X.arc(px+S*0.62,py+S*0.64,S*0.16,0,TAU); X.fill();
    }else if(k==='D'){
      const tw=0.6+0.4*Math.sin(t*5+c+r);
      X.fillStyle='#8affff'; X.globalAlpha=tw;
      X.beginPath();
      X.moveTo(px+S/2,py+S*0.12); X.lineTo(px+S*0.88,py+S/2);
      X.lineTo(px+S/2,py+S*0.88); X.lineTo(px+S*0.12,py+S/2);
      X.closePath(); X.fill(); X.globalAlpha=1;
      X.fillStyle='rgba(255,255,255,.85)';
      X.fillRect(px+S*0.42,py+S*0.28,S*0.10,S*0.16);
    }
  }
  // hero, dug into the middle
  const hx=x0+w/2-S/2, hy=y0+h*0.52, bob=Math.sin(t*6)*1.2;
  X.fillStyle='#0a0704'; X.fillRect(hx-S*0.2,hy-S*0.2,S*1.4,S*1.4);
  X.fillStyle='#ffd23b'; X.fillRect(hx+S*0.16,hy+S*0.10+bob,S*0.68,S*0.80);
  X.fillStyle='#02030a';
  X.fillRect(hx+S*0.28,hy+S*0.26+bob,S*0.14,S*0.14);
  X.fillRect(hx+S*0.58,hy+S*0.26+bob,S*0.14,S*0.14);
  X.fillStyle='#ff5d73'; X.fillRect(hx+S*0.16,hy+S*0.72+bob,S*0.68,S*0.18);
  // a butterfly patrolling
  const bx=x0+w*0.5+Math.sin(t*1.3)*w*0.30, by=y0+h*0.22;
  X.fillStyle='#8effc0';
  X.fillRect(bx-S*0.30,by-S*0.16,S*0.60,S*0.32);
  X.fillStyle='rgba(255,255,255,.7)';
  X.fillRect(bx-S*0.30+ (Math.floor(t*8)%2?S*0.06:0),by-S*0.06,S*0.14,S*0.12);
  X.restore();
}
function artFist(x0,y0,x1,y1,t){
  const w=x1-x0,h=y1-y0,cx=x0+w/2;
  X.save(); X.beginPath(); X.rect(x0,y0,w,h); X.clip();
  const g=X.createLinearGradient(0,y0,0,y1);
  g.addColorStop(0,'#20304a'); g.addColorStop(1,'#101828');
  X.fillStyle=g; X.fillRect(x0,y0,w,h);
  // skyline
  X.fillStyle='rgba(0,0,0,.45)';
  for(let i=0;i<8;i++){ const bx=x0+i*(w/8), bh=h*0.22+((i*53)%Math.round(h*0.3));
    X.fillRect(bx,y0+h*0.62-bh,w/8-6,bh); }
  X.fillStyle='rgba(255,220,120,.5)';
  for(let i=0;i<26;i++) X.fillRect(x0+((i*97)%w), y0+h*0.30+((i*61)%Math.round(h*0.30)), 2,3);
  // floor
  const gy=y0+h*0.72;
  X.fillStyle='#4a3a2a'; X.fillRect(x0,gy,w,y1-gy);
  X.fillStyle='#6a5a3a'; X.fillRect(x0,gy,w,4);
  // health bars + timer
  X.fillStyle='#000'; X.fillRect(x0+6,y0+6,w*0.34,9); X.fillRect(x1-6-w*0.34,y0+6,w*0.34,9);
  X.fillStyle='#33cc44';
  X.fillRect(x0+8,y0+8,w*0.34*(0.55+0.35*Math.sin(t*0.9)),5);
  X.fillRect(x1-8-w*0.34*(0.50+0.40*Math.cos(t*1.1)),y0+8,w*0.34*(0.50+0.40*Math.cos(t*1.1)),5);
  X.fillStyle='#000'; X.fillRect(cx-13,y0+4,26,15);
  X.fillStyle='#ffdd55'; X.fillRect(cx-8,y0+7,5,9); X.fillRect(cx+3,y0+7,5,9);
  // two fighters trading blows
  const beat=Math.floor(t*1.6)%2, hit=(t*1.6)%1<0.35;
  function guy(px,face,gi,trim,skin,hair,punching){
    const feet=gy+3, top=gy-h*0.36, hip=top+(feet-top)*0.52, sh=top+(feet-top)*0.16;
    const lw=Math.max(3,w*0.022);
    X.lineCap='round';
    X.strokeStyle=gi; X.lineWidth=lw;
    X.beginPath(); X.moveTo(px-face*w*0.018,hip); X.lineTo(px-face*w*0.04,feet); X.stroke();
    X.beginPath(); X.moveTo(px+face*w*0.015,hip); X.lineTo(px+face*w*0.045,feet); X.stroke();
    X.lineWidth=lw*1.8;
    X.beginPath(); X.moveTo(px,hip); X.lineTo(px,sh); X.stroke();
    X.fillStyle='#111'; X.fillRect(px-w*0.02,hip-2,w*0.04,4);
    const ext = punching? w*0.085 : w*0.03;
    const fx=px+face*ext, fy=sh+h*0.03;
    X.strokeStyle=gi; X.lineWidth=lw;
    X.beginPath(); X.moveTo(px+face*w*0.005,sh+h*0.02); X.lineTo(fx,fy); X.stroke();
    X.fillStyle=skin; X.beginPath(); X.arc(fx,fy,w*0.017,0,TAU); X.fill();
    const hr=w*0.026, hy=sh-h*0.05;
    X.fillStyle=skin; X.beginPath(); X.arc(px,hy,hr,0,TAU); X.fill();
    X.fillStyle=hair; X.beginPath(); X.arc(px,hy-1,hr,Math.PI*1.02,Math.PI*2.06); X.fill();
    X.fillStyle=trim; X.fillRect(px-hr,hy-hr*0.4,hr*2,2.5);
  }
  guy(cx-w*0.17, 1,'#f0f0f0','#dd2222','#f0c090','#221100', beat===0);
  guy(cx+w*0.17,-1,'#ffdd55','#dd2222','#c88a58','#100804', beat===1);
  if(hit){
    const ix=cx+(beat===0? w*0.06 : -w*0.06), iy=gy-h*0.22, R=w*0.045;
    X.fillStyle='#ffdd55'; X.beginPath();
    for(let i=0;i<10;i++){ const a=TAU*i/10-Math.PI/2, rr=i%2?R*0.42:R;
      const px2=ix+Math.cos(a)*rr, py2=iy+Math.sin(a)*rr;
      i?X.lineTo(px2,py2):X.moveTo(px2,py2); }
    X.closePath(); X.fill();
  }
  X.restore();
}
function artRuka(x0,y0,x1,y1,t){
  const w=x1-x0,h=y1-y0,cx=x0+w/2;
  X.save(); X.beginPath(); X.rect(x0,y0,w,h); X.clip();
  const scroll=(t*40)%64;
  X.fillStyle='#2c4a1e'; X.fillRect(x0,y0,w,h);
  X.fillStyle='#35591f';
  for(let y=-64+scroll;y<h+64;y+=64) X.fillRect(x0,y0+y,w,32);
  X.fillStyle='rgba(107,90,52,.5)'; X.fillRect(cx-w*0.14,y0,w*0.28,h);
  // sandbag walls drifting down
  X.fillStyle='#7a6a44';
  for(let i=0;i<5;i++){
    const bx=x0+((i*97)%Math.max(1,w-70))+8;
    const by=y0+((i*130+scroll*1.6)%(h+70))-40;
    for(let k=0;k<3;k++) X.fillRect(bx+k*17,by,16,10);
  }
  // trees
  for(let i=0;i<3;i++){
    const tx=x0+18+((i*151)%Math.max(1,w-44));
    const ty=y0+((i*190+scroll*1.6)%(h+80))-40;
    X.fillStyle='#1c3512'; X.beginPath(); X.arc(tx,ty,15,0,TAU); X.fill();
  }
  function man(px,py,col,trim,aimUp){
    X.fillStyle='rgba(0,0,0,.3)';
    X.beginPath(); X.ellipse(px,py+9,9,3.5,0,0,TAU); X.fill();
    X.strokeStyle=col; X.lineWidth=4; X.lineCap='round';
    X.beginPath(); X.moveTo(px-2,py+1); X.lineTo(px-3,py+9); X.stroke();
    X.beginPath(); X.moveTo(px+2,py+1); X.lineTo(px+3,py+9); X.stroke();
    X.fillStyle=col; X.fillRect(px-6,py-8,12,11);
    X.fillStyle=trim; X.fillRect(px-6,py-2,12,3);
    X.strokeStyle='#20201c'; X.lineWidth=2.5;
    X.beginPath(); X.moveTo(px,py-4); X.lineTo(px,py-4+(aimUp?-13:13)); X.stroke();
    X.fillStyle='#e0b088'; X.beginPath(); X.arc(px,py-11,5,0,TAU); X.fill();
    X.fillStyle=trim; X.beginPath(); X.arc(px,py-12,5.5,Math.PI,TAU); X.fill();
  }
  // enemies coming down, hero at the bottom
  for(let i=0;i<3;i++){
    const ex=x0+30+((i*173)%Math.max(1,w-60));
    const ey=y0+((i*150+scroll*2.2)%(h*0.7))+h*0.06;
    man(ex,ey,'#6a2a2a','#c86a4a',false);
  }
  const hx=cx+Math.sin(t*1.1)*w*0.16, hy=y0+h*0.78;
  man(hx,hy,'#3f6a2c','#9ad284',true);
  // muzzle flash and tracer
  if((t*4)%1<0.5){
    X.fillStyle='#ffffa0';
    for(let k=0;k<3;k++) X.fillRect(hx-1.5, hy-24-k*22, 3, 9);
    X.fillStyle='#ffd23b';
    X.beginPath(); X.arc(hx,hy-19,4.5,0,TAU); X.fill();
  }
  X.restore();
}
const ART={tower:artTower,pinball:artPinball,batty:artBatty,boulder:artBoulder,fist:artFist,ruka:artRuka};

/* ---- the preview card ---- */
function drawCard(t){
  const g=GAMES[sel];
  // frame
  X.fillStyle='#0a0f26'; X.fillRect(CARD_X0-4,CARD_Y0-4,CARD_X1-CARD_X0+8,CARD_Y1-CARD_Y0+8);
  ART[g.art](CARD_X0,CARD_Y0,CARD_X1,CARD_Y1-PLATE,t);
  X.fillStyle='#02030a'; X.fillRect(CARD_X0,CARD_Y1-PLATE,CARD_X1-CARD_X0,PLATE);
  // glow border
  X.strokeStyle='#ffd23b'; X.lineWidth=2;
  X.shadowColor='rgba(255,210,59,.7)'; X.shadowBlur=14;
  X.strokeRect(CARD_X0-3,CARD_Y0-3,CARD_X1-CARD_X0+6,CARD_Y1-CARD_Y0+6);
  X.shadowBlur=0;
  // scanlines over the preview
  X.fillStyle='rgba(0,0,0,.22)';
  for(let y=CARD_Y0;y<CARD_Y1;y+=3) X.fillRect(CARD_X0,y,CARD_X1-CARD_X0,1);
  // title plate
  X.fillStyle='rgba(2,3,10,.92)'; X.fillRect(CARD_X0,CARD_Y1-PLATE,CARD_X1-CARD_X0,PLATE);
  X.fillStyle='rgba(255,210,59,.35)'; X.fillRect(CARD_X0,CARD_Y1-PLATE,CARD_X1-CARD_X0,1);
  let ts=22; X.font='bold '+ts+'px "Courier New",monospace';
  while(X.measureText(g.title).width>CARD_X1-CARD_X0-24 && ts>11){ ts--; X.font='bold '+ts+'px "Courier New",monospace'; }
  text(g.title,W/2,CARD_Y1-29,ts,'#ffd23b','center');
  text(G(g,'tribute'),W/2,CARD_Y1-11,10,'#7fa0ff','center','normal');
}

/* ---- game list ---- */
function drawList(){
  rows.length=0;
  const y0=LIST_Y0, rh=ROW_H;
  for(let i=0;i<GAMES.length;i++){
    const g=GAMES[i], y=y0+i*rh, on=(i===sel), hv=(i===hover);
    rows.push({y0:y-rh/2+2,y1:y+rh/2-2,i});
    if(on){
      X.fillStyle='rgba(255,210,59,.13)'; X.fillRect(30,y-rh/2+2,W-60,rh-4);
      X.fillStyle='#ffd23b'; X.fillRect(30,y-rh/2+2,3,rh-4);
    }else if(hv){
      X.fillStyle='rgba(127,160,255,.10)'; X.fillRect(30,y-rh/2+2,W-60,rh-4);
    }
    if(on && Math.floor(perf/380)%2===0) text('▶',48,y-6,15,'#ffd23b','center');
    text(String(i+1),48,y+11,10,'#5f7ad0','center','normal');
    let ts=17; X.font='bold '+ts+'px "Courier New",monospace';
    while(X.measureText(g.title).width>250 && ts>10){ ts--; X.font='bold '+ts+'px "Courier New",monospace'; }
    text(g.title,68,y-7,ts,on?'#e8eeff':'#9fb6ff','left');
    text(G(g,'ctrl'),68,y+10,9,on?'#8ef0a0':'#5f7ad0','left','normal');
    text(g.year,W-42,y,13,on?'#ffd23b':'#3a4a99','right');
  }
}

/* ---- footer of the screen ---- */
function drawFoot(){
  const g=GAMES[sel];
  X.fillStyle='rgba(95,120,200,.28)'; X.fillRect(34,RULE_Y,W-68,1);
  // description of the selected game, wrapped
  X.font='normal 11px "Courier New",monospace';
  const words=G(g,'desc').split(' ');
  const lines=[]; let cur='';
  for(const wd of words){
    const tryl=cur?cur+' '+wd:wd;
    if(X.measureText(tryl).width>W-80 && cur){ lines.push(cur); cur=wd; } else cur=tryl;
  }
  if(cur) lines.push(cur);
  lines.slice(0,3).forEach((L,i)=>text(L,W/2,DESC_Y+i*14,11,'#9fb6ff','center','normal'));

  if(Math.floor(perf/450)%2===0) text(T('press'),W/2,PRESS_Y,15,'#ffd23b','center');
  text(T('nav'),W/2,NAV_Y,9.5,'#5f7ad0','center','normal');
  text('↗ '+T('newwin'),W/2,WIN_Y,9,'#3a4a99','center','normal');
}

/* ---------------- loop ---------------- */
function frame(ts){
  requestAnimationFrame(frame);
  if(!last) last=ts;
  let dt=(ts-last)/1000; last=ts; perf=ts;
  if(dt>0.05) dt=0.05;
  if(tiltT>0){ tiltT-=dt; if(tiltT<=0) cabEl.classList.remove('tiltL','tiltR'); }
  const t=ts/1000;
  drawBg(dt);
  drawHeader();
  drawCard(t);
  drawList();
  drawFoot();
}

/* ---------------- offline notice ---------------- */
const offEl=document.getElementById('offline'),
      offhEl=document.getElementById('offh'),
      offbEl=document.getElementById('offb'),
      offbtn=document.getElementById('offbtn');
function noticeOpen(){ return offEl.classList.contains('on'); }
function showNotice(on){
  offhEl.textContent=T('blockh'); offbEl.textContent=T('blockb'); offbtn.textContent=T('open');
  offEl.classList.toggle('on',!!on);
}
offbtn.addEventListener('click',e=>{
  e.preventDefault();
  const url=pendingURL||gameURL(GAMES[sel]);
  showNotice(false);
  let w=null;
  try{ w=window.open(url,GAME_WINDOW); }catch(e2){}
  if(w){ try{ w.focus(); }catch(e2){} }
  else { location.href=url; }     // last resort: this tab, straight from a click
});

/* ---------------- install prompt ---------------- */
let deferredPrompt=null;
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; buildChrome(); });
addEventListener('appinstalled',()=>{ deferredPrompt=null; buildChrome(); });
function doInstall(){
  if(!deferredPrompt) return;
  const p=deferredPrompt; deferredPrompt=null;
  p.prompt(); buildChrome();
}

/* ---------------- service worker ---------------- */
const swOK=(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1');
if('serviceWorker' in navigator && swOK){
  addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

/* ---------------- boot ---------------- */
function boot(){
  document.documentElement.lang=lang;
  buildLangs(); buildChrome();
  selectFromHash();
  requestAnimationFrame(frame);
}
/* A deep link only preselects the game. Opening a window without a click of
   its own would be swallowed by every pop-up blocker there is, so the last
   step stays with the player: one press of START. */
function selectFromHash(){
  const h=(location.hash||'').replace('#','').toLowerCase();
  if(!h) return;
  const i=GAMES.findIndex(g=>g.id===h||g.repo===h);
  if(i>=0 && i!==sel){ sel=i; buildChrome(); }
}
addEventListener('hashchange',selectFromHash);
boot();

/* test hook */
window.__arcade={GAMES,launch,openGame,move,setLang,gameURL,showNotice,
  get sel(){return sel;}, get lang(){return lang;}, get noticeOpen(){return noticeOpen();}};
</script>
